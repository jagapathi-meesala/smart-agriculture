name: crop-disease-risk
description: Assesses the likelihood of specific crop diseases based on humidity, temperature, and crop type.
input_schema:
  type: object
  properties:
    crop:
      type: string
      description: Target crop
    humidity:
      type: number
      description: Average humidity percentage
    avg_temp:
      type: number
      description: Average temperature in Celsius
  required:
    - crop
    - humidity
    - avg_temp
